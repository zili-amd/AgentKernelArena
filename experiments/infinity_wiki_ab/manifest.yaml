# Kernel knowledge base A/B experiment on MI300X: KernelForge with and without
# InstinctWiki (infinity-wiki). Protocol: PROTOCOL.md; setup and runs: skills/.
# Append to `invocations` and `exclusions` while running; never edit
# `preregistration` after the first main-phase launch.
experiment: instinct-wiki-ab
question: >-
  Does read-only access to the InstinctWiki knowledge base make the kernels
  KernelForge writes on MI300X faster, from the same starting point in the same time?
hardware:
  gpu: MI300X
  arch: gfx942
  node: shared MI300X dev node   # the pilots; screening/ was measured here
  docker_image: lmsysorg/sglang:v0.5.12-rocm720-mi30x
  rocm: 7.2.0

pins:
  # The commit pack.sh runs from (dist/pins.txt records it); this file lives in that commit.
  agentkernelarena: {repo: AMD-AGI/AgentKernelArena, branch: infinity-wiki-AB-test}
  # main f2b32cdc9 plus the read-only knowledge base tools for every forge role, and declared test_*.py
  # targets left editable (ROCmBench colocates a kernel with its tests).
  hyperloom: {repo: AMD-AGI/Hyperloom, branch: forge-knowledge-wiki-tool, commit: 19266e1de1d54272093ed23fce0767220c9597d1}
  geak: {commit: c0c0e2aee5e2bec70583253058382523bdf7a3ab}   # agents/geak/compatibility.py UPSTREAM_REVISION
  # 20 curated pages, 147 source pages (18 official AMD docs), a SKILL.md that matches the corpus.
  # Overlap audit at 0e70cb2: refk_fp8_blockwise_mm and mla_decode are transfer (no page names them);
  # moe_gemm and test_flashattention_fwd are self-reference (kernel-rocmbench-triton-tflops holds AKA's
  # baseline TFLOPs for them, no implementation), so report those two separately.
  wiki: {repo: AMD-BRAIN-Internal/infinity-wiki, branch: main, commit: 0e70cb2bcc398c4720c8223426c0bdcd42a0b1aa, variant: v0-unmodified}
  # main plus 8 gfx942 technique and hardware pages (FP8 FNUZ/OCP, CDNA3 MFMA operand layout, FlashAttention
  # forward loop, MoE block-aligned grouped GEMM, HIP latency hiding, Triton tuning, XCD remap) and 12 sources.
  # Overlap audit: no task path, task identifier or task kernel name; its snippets are generic patterns.
  # The pages target these four operator classes, so this arm tests targeted against general content.
  wiki_branch: {repo: AMD-BRAIN-Internal/infinity-wiki, branch: gfx942-technique-context, commit: e7f8e84de3f4ec9844edfbdeeaa9a4dc334d0832, variant: v1-gfx942-technique-context}
  model: claude-opus-5  # confirm the gateway's id at the pilot; identical in every arm

# knowledge_wiki names the wiki pin an arm reads (checked out at src/infinity-<pin with - for _>), or false.
arms:
  kf: {template: forge, knowledge_wiki: false}
  kf_wiki: {template: forge, knowledge_wiki: wiki}
  kf_wiki_branch: {template: forge, knowledge_wiki: wiki_branch}
  geak: {template: geak, knowledge_wiki: false}
  geak_wiki: {template: geak, knowledge_wiki: wiki}

# Only kernels whose baseline is far from the MI300X roofline are experiment
# subjects: a near-optimal baseline leaves no room for the wiki to show an effect.
selection_rule: >-
  A main-phase task needs (1) headroom >= 3x: the sum of its baseline case times
  measured on MI300X divided by the sum of per-case effective bounds, where an
  effective bound is max(roofline, 5 us launch floor) and the roofline uses
  FP8 2614.9 / BF16 1307.4 / FP32 163.4 TFLOPS and 5.3 TB/s HBM (roofline.py);
  (2) at least one directly relevant wiki page; (3) gfx942 validity
  via task_validator; (4) an implemented Triton or HIP candidate. If fewer than
  4 tasks qualify (12 pairs per system), author naive-baseline gfx942 tasks from
  gpu-mode/reference-kernels problems/amd (moe, mla-decode) and screen them the
  same way before the main phase.

phases:
  pilot:
    timeout_seconds: 7200
    repeats: 1
    tasks:
      - triton2triton/geak_eval/L1/refk_fp8_blockwise_mm
  screening:
    # Baseline-only measurements on MI300X; no agent runs. Selects `main.tasks`.
    candidates:
      - triton2triton/geak_eval/L1/refk_fp8_blockwise_mm   # estimated >= 7.6-19.8x headroom
      - hip2hip/others/mla_decode                         # estimated >= 27-425x headroom
      - triton2triton/rocmbench/hard/moe_gemm
      - triton2triton/rocmbench/hard/test_flashattention_fwd
      - triton2triton/rocmbench/medium/rmsnorm_fwd
      - triton2triton/rocmbench/medium/softmax
      - triton2triton/geak_eval/L2/topk
    # Not screened: aiter production kernels (mi300x_sglang_*, geak_eval mla_decode,
    # lean_atten_paged, fused_qk_rope_cache_mla) are near-optimal by construction;
    # vllm triton_decode_attn_stage1 (max_seq 128) and the hip2hip/gpumode modules
    # (4x4x4-sized inputs) are launch-bound; fused_moe_mxfp4 needs gfx950.
  main:
    timeout_seconds: 21600
    repeats: 1
    # Screened on MI300X (5 rounds): headroom vs max(roofline, 5 us) and the relevant wiki pages.
    # rmsnorm_fwd 1.4x, topk 1.6x and softmax 2.7x fall below 3x.
    tasks:
      - triton2triton/geak_eval/L1/refk_fp8_blockwise_mm     # 30.1x; technique-fine-grained-quantization, kernel-gemm-dense-matmul
      - hip2hip/others/mla_decode                            # 12903x; kernel-mla-sparse-decode-fp8, kernel-vllm-decode-paged-attention
      - triton2triton/rocmbench/hard/test_flashattention_fwd # 5.4x; kernel-attention-dot-product
      - triton2triton/rocmbench/hard/moe_gemm               # 4.4x; kernel-moe-mxfp4, kernel-gemm-dense-matmul

schedule:
  # This round runs ARMS="kf kf_wiki kf_wiki_branch" (GEAK refuses to run as root in the runtime).
  # One wave = two tasks, three arms each, on GPUs 0-2 and 3-5; the four tasks take two waves.
  # Arm i of task j in repeat r runs on GPU base + (i + r + j) % 3, arms in the order of dist/arms.txt.
  arms_per_pair: 3
  gpu_bases: [0, 3]

preregistration:
  primary_metric: >-
    Per (task, repeat, arm): AKA average_speedup = mean over performance cases of
    baseline_time / final_time, baseline = the task's frozen initial candidate.
    A failed, incorrect or unscoreable final (AKA reports 0.0) counts as 1.0.
  primary_comparison: >-
    Per task, the paired log ratios log(kf_wiki / kf), log(kf_wiki_branch / kf) and
    log(kf_wiki_branch / kf_wiki): one repeat, so 4 pairs per comparison.
  test: >-
    Descriptive. With 4 pairs the exact two-sided Wilcoxon p cannot fall below 0.125, so
    report each pair, the median ratio and its bootstrap CI, and claim no significance.
  headline_numbers: quiet re-measurement (>= 5 interleaved rounds per task, same GPU) replaces in-run timings.
  secondary:
    - kf vs geak (biased toward forge by AKA's arithmetic-mean objective; report all three aggregates)
    - geometric-mean and time-weighted aggregates
    - pass rate, wiki call count, wall clock and tokens per run
    - held-out conditional correctness per arm
  exclusion_rule: a run that fails audit_run.py (exit 1) is excluded and rerun with the same GPU slot.

invocations: []
exclusions: []
