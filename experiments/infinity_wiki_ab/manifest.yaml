# Kernel knowledge base A/B experiment on MI300X: KernelForge with and without
# InstinctWiki (infinity-wiki). Protocol: PROTOCOL.md; setup and runs: skills/.
# Append to `invocations` and `exclusions` while running; never edit
# `preregistration` after the first main-phase launch.
experiment: instinct-wiki-ab
question: >-
  Does read-only access to the InstinctWiki knowledge base make the kernels
  KernelForge writes on MI300X faster, from the same starting point in the same time?
hardware:
  gpu: MI300X
  arch: gfx942
  node: shared MI300X dev node   # the pilots; screening/ was measured here
  docker_image: lmsysorg/sglang:v0.5.12-rocm720-mi30x
  rocm: 7.2.0

pins:
  # The commit pack.sh runs from (dist/pins.txt records it); this file lives in that commit.
  agentkernelarena: {repo: AMD-AGI/AgentKernelArena, branch: infinity-wiki-AB-test}
  # Two Hyperloom branches so test A and test B differ only by the wiki integration. Each adds the reasoning
  # change: the implementer states a decision-focused rationale and it is logged on every iteration_result
  # (forge-reasoning-main and forge-knowledge-wiki-reasoning-main both carry it). The kf arm gets `hyperloom`
  # (main 1a444f6b8 + reasoning, no knowledge base), kf_wiki gets `hyperloom_wiki` (the same reasoning plus the
  # read-only knowledge base tools for every forge role, with each wiki call now carrying a required logged
  # reason). Both also keep each fan-out lane's own rationale for the iteration that measures it (the 12 h long
  # job on 816718bc0 / 1d51fd5b8 logged only "lane N of a fan-out round"), and both let a declared test_*.py
  # target escape the test-name protection (c4a848920): without it every edit to the attention task's
  # test_flashattention_fwd.py is denied. Both also take --target-mean-case-speedup, which the main phase
  # sets per task (phases.main.speedup_targets) so a run stops at 90% of its roofline mean case speedup.
  hyperloom: {repo: AMD-AGI/Hyperloom, branch: forge-reasoning-main, commit: 8e24562d7bd87795317fcbca8338acd63f449d8f}
  hyperloom_wiki: {repo: AMD-AGI/Hyperloom, branch: forge-knowledge-wiki-reasoning-main, commit: 33f0c340a78a497b776b8ee0d665fa2fffcc432c}
  # The guided round's engine (arm kf_wiki_guided): hyperloom_wiki plus forge-loop --wiki-guided (528b463e), which
  # first builds a playbook from the knowledge base and plans from it -- one whole open group per lane, cited and
  # credited from the measured plan -- until it is spent, the search stalls or 35% of the budget is used, then plans
  # freely; and (ccf5f599) GUIDED rounds analyze each open group whole in place of the compute, memory and
  # algorithm specialists, which FREE rounds keep. Without --wiki-guided it plans as hyperloom_wiki.
  hyperloom_wiki_guided: {repo: AMD-AGI/Hyperloom, branch: forge-wiki-guided, commit: ccf5f599b8d7911ca492bc157467f7fcaf5da129}
  geak: {commit: c0c0e2aee5e2bec70583253058382523bdf7a3ab}   # agents/geak/compatibility.py UPSTREAM_REVISION
  # Test with infinity-wiki PR #1 (branch gfx942-memory-bound-reduction-gemv), one commit on main cdcda80.
  # Over the previous pin 0523818: main cdcda80 adds Hyperloom's knowledge cards (sources/community-kb) and the
  # language pages built from them, a summary of the forge local_wiki both arms already have; the PR adds measured
  # MI300X HBM and Infinity Cache figures (hw-hbm3), strided-axis and cross-workgroup reductions, GEMV and skinny
  # GEMM, attention launch configuration for short sequences, and gfx942 non-temporal code generation, from
  # upstream code, official docs, papers and one benchmark article. General technique pages are the treatment
  # being measured; a page giving a task's exact solution is not. main ca5d232 merges that PR (#1) and PR #2,
  # gfx942 weight-only INT4 GEMM and block-scaled FP8 GEMM pages, for the two vllm_large tasks. The main
  # invocation started 2026-10-15 04:14 UTC runs on 26ea276 (v4-pr1); later invocations record their own.
  wiki: {repo: AMD-BRAIN-Internal/infinity-wiki, branch: main, commit: ca5d232ebddb2b6a7eeabb569c5c84b964c6c83c, variant: v5-main-pr2}
  # Opus 5.5, identical in every arm. claude-opus-5-5 answered on 2026-10-15 through Claude Code 2.1.296
  # (setup_node.sh's pin); Claude Code older than 2.1.280 cannot use this model.
  model: claude-opus-5-5

# hyperloom names the forge engine branch a forge arm installs and runs (checked out at src/<pin with - for _>);
# knowledge_wiki names the wiki pin an arm reads (checked out at src/infinity-<pin with - for _>), or false.
# This round is test A (kf: hyperloom, no wiki) vs test B (kf_wiki: hyperloom_wiki, reads main); they differ
# only by the wiki integration and the knowledge base, so the comparison isolates the wiki's effect.
# The guided round is kf vs kf_wiki_guided (deploy and pack with ARMS="kf kf_wiki_guided"): the same knowledge
# base as kf_wiki, but the loop plans from a playbook it builds from it before planning freely. It changes the
# workflow together with the knowledge base, so that comparison measures the two together; its primary reading is
# the time to each task's speedup target and the time-averaged best speedup (collect_results.py), since the stop
# rule truncates final speedups.
arms:
  kf: {template: forge, hyperloom: hyperloom, knowledge_wiki: false}
  kf_wiki: {template: forge, hyperloom: hyperloom_wiki, knowledge_wiki: wiki}
  kf_wiki_guided: {template: forge, hyperloom: hyperloom_wiki_guided, knowledge_wiki: wiki, wiki_guided: true}
  geak: {template: geak, knowledge_wiki: false}
  geak_wiki: {template: geak, knowledge_wiki: wiki}

# Rewrite and tune, no fusion: the round measures whether the wiki helps an agent
# rewrite one kernel and choose its launch configuration within the task's scope.
selection_rule: >-
  A task needs (1) one operator whose baseline launches one kernel, so the best
  solution needs no fusion; (2) the kernel, its launcher and its configuration
  helpers editable, with references, inputs, tolerances and timing protected;
  (3) cases well above the 5 us launch floor and headroom >= 2x, the sum of its
  baseline case times on MI300X over the sum of max(roofline, 5 us), with
  FP8 2614.9 / BF16 1307.4 / FP32 163.4 TFLOPS and 5.3 TB/s HBM, or for the
  vllm_large tasks the attained MI300X figures from measure_peaks.py (roofline.py);
  (4) AKA's own measurement driver and a baseline spread <= 3%; (5) no wiki page
  that gives the task's solution. prefilter.py, screen_baselines.py and
  screening/ hold the screen; make_variants.py writes the production-size HIP
  variants, the open-launcher Triton variants, the own-kernels torch2hip variants
  and the LLM-shape vLLM variants.

phases:
  pilot:
    # Three repeats in parallel, two GPUs each, before the main phase. 2 h 15 min: the adapter keeps 600 s
    # for itself, and KernelForge profiles only when its own budget exceeds 2 h.
    timeout_seconds: 8100
    repeats: 3
    tasks:
      - hip2hip/gpumode_large/SimpleMatmulModule   # 13.2x; technique-hip-mfma-gemm-tiling, hw-mfma, hw-mfma-operand-layout-cdna3
    speedup_targets:
      hip2hip/gpumode_large/SimpleMatmulModule: 11.458
  screening:
    # The previous round's screen (screening/mi300x-screening.txt). This round's candidates are
    # screening/rewrite-candidates*.txt, screened with screen_baselines.py --only.
    # Baseline-only measurements on MI300X; no agent runs.
    candidates:
      - triton2triton/geak_eval/L1/refk_fp8_blockwise_mm   # estimated >= 7.6-19.8x headroom
      - hip2hip/others/mla_decode                         # estimated >= 27-425x headroom
      - triton2triton/rocmbench/hard/moe_gemm
      - triton2triton/rocmbench/hard/test_flashattention_fwd
      - triton2triton/rocmbench/medium/rmsnorm_fwd
      - triton2triton/rocmbench/medium/softmax
      - triton2triton/geak_eval/L2/topk
    # Not screened: aiter production kernels (mi300x_sglang_*, geak_eval mla_decode,
    # lean_atten_paged, fused_qk_rope_cache_mla) are near-optimal by construction;
    # vllm triton_decode_attn_stage1 (max_seq 128) and the hip2hip/gpumode modules
    # (4x4x4-sized inputs) are launch-bound; fused_moe_mxfp4 needs gfx950.
  main:
    # 12 h per run, as in the 12 h pilots; the 90% stop rule below can end a run earlier.
    timeout_seconds: 43200
    repeats: 3
    # Screened on MI300X (5 rounds); headroom vs max(roofline, 5 us). The Triton tasks are the
    # open-launcher variants from make_variants.py; the torch2hip tasks are its own-kernels
    # variants, whose candidate starts empty (forge's initialize workflow, then the loop). The
    # vllm_large tasks are its LLM-shape variants of the two kernels vLLM runs on ROCm by default
    # for AWQ and DeepSeek-V3 FP8 linear layers; their wiki leakage audit is still to do.
    tasks:
      - hip2hip/gpumode_large/SimpleMatmulModule   # 13.2x; FP32 GEMM
      - hip2hip/gpumode_large/SoftmaxModule        # 3.4x; FP32 row softmax; technique-row-reduction-kernels
      - triton2triton/rocmbench_open/hard/test_flashattention_fwd  # 10.5x; FP16 causal attention, head_dim 64
      - triton2triton/geak_eval_open/L3/gemm       # 6.6x; BF16 GEMM + bias, M 1-16384; technique-gemm-tile-scheduling
      - triton2triton/rocmbench_open/hard/gemm     # 2.3x; FP16 GEMM; technique-triton-amd-kernel-tuning, technique-gemm-tile-scheduling
      - triton2triton/rocmbench_open/medium/naive_softmax  # 9.3x; row softmax; technique-row-reduction-kernels
      - torch2hip/kernelbench_own/level1/l1n95_CrossEntropyLoss  # 4.2x; FP32 cross entropy, 8192x1024-8192x16384
      - torch2hip/kernelbench_own/level1/l1n36_RMSNorm_  # 3.7x; FP32 RMSNorm over 64 channels
      - torch2hip/kernelbench_own/level1/l1n4_Matrix_vector_multiplication_  # 2.5x; FP32 matrix-vector, K 131072-262144
      # 14.6x; AWQ int4 decode GEMM, Llama-3.1-70B layers at M 1 and 32. Across five screens the M=1
      # qkv/gate_up/down cases stayed <= 0.7%, o M=1 2.9-3.5% and down M=32 1.3-5.0%.
      - triton2triton/vllm_large/triton_awq_gemm
      - triton2triton/vllm_large/triton_w8a8_block_scaled_mm  # 2.9x; FP8 block GEMM, DeepSeek-V3 layers at M 128 and 4096
    # Each run stops once its incumbent's mean case speedup (the KEEP objective) reaches 90% of the task's
    # roofline mean case speedup: the mean over performance cases of baseline / max(roofline, 5 us), from the
    # screening baselines (screening/mi300x-rewrite-baselines.json, mi300x-variant-baselines.json,
    # mi300x-vllm-large-baselines.json;
    # roofline.py --stop-fraction 0.9). Both arms share each target. On the 12 h SoftmaxModule pilot all six
    # runs reached 90% in 2.6-6.6 h and ended at 91-96%, so the rest of the budget bought 0.02-0.18x.
    stop_fraction: 0.9
    speedup_targets:
      hip2hip/gpumode_large/SimpleMatmulModule: 11.458
      hip2hip/gpumode_large/SoftmaxModule: 3.134
      triton2triton/rocmbench_open/hard/test_flashattention_fwd: 8.228
      triton2triton/geak_eval_open/L3/gemm: 15.531
      triton2triton/rocmbench_open/hard/gemm: 2.463
      triton2triton/rocmbench_open/medium/naive_softmax: 19.019
      torch2hip/kernelbench_own/level1/l1n95_CrossEntropyLoss: 3.874
      torch2hip/kernelbench_own/level1/l1n36_RMSNorm_: 3.429
      torch2hip/kernelbench_own/level1/l1n4_Matrix_vector_multiplication_: 1.909
      triton2triton/vllm_large/triton_awq_gemm: 12.391
      triton2triton/vllm_large/triton_w8a8_block_scaled_mm: 3.320
  guided:
    # The guided round's first test: kf (KernelForge without the knowledge base or the guided workflow) vs
    # kf_wiki_guided on the two vllm_large tasks, one task per machine (start.sh main --phase guided --tasks ...),
    # its three repeats of both arms at once on six GPUs, 3 h per run, stopping at the main phase's targets.
    timeout_seconds: 10800
    repeats: 3
    tasks:
      - triton2triton/vllm_large/triton_awq_gemm
      - triton2triton/vllm_large/triton_w8a8_block_scaled_mm
    speedup_targets:
      triton2triton/vllm_large/triton_awq_gemm: 12.391
      triton2triton/vllm_large/triton_w8a8_block_scaled_mm: 3.320

schedule:
  # This round runs ARMS="kf kf_wiki" (GEAK refuses to run as root in the runtime).
  # One (task, repeat) takes two GPUs; arm i in repeat r runs on GPU base + (i + r + task index) % 2.
  arms_per_pair: 2
  gpu_bases: [0, 2, 4, 6]
  # by-task: one machine per task family (start.sh main --tasks "triton2triton/" on one, "torch2hip/" on
  # the other); each machine runs one task at a time, its three repeats of both arms at once on six GPUs,
  # and starts the next task only after all six runs have ended.
  waves: by-task

preregistration:
  primary_metric: >-
    Per (task, repeat, arm): AKA average_speedup = mean over performance cases of
    baseline_time / final_time, baseline = the task's frozen initial candidate.
    A failed, incorrect or unscoreable final (AKA reports 0.0) counts as 1.0.
  primary_comparison: >-
    Per (task, repeat), the paired log ratio log(kf_wiki / kf): 3 pairs per task,
    33 over the eleven main tasks.
  test: >-
    Descriptive per task (3 pairs). Over 33 pairs, the exact two-sided Wilcoxon
    signed-rank test and the bootstrap CI of the median ratio; report each pair.
  headline_numbers: quiet re-measurement (>= 5 interleaved rounds per task, same GPU) replaces in-run timings.
  secondary:
    - kf vs geak (biased toward forge by AKA's arithmetic-mean objective; report all three aggregates)
    - geometric-mean and time-weighted aggregates
    - pass rate, wiki call count, wall clock and tokens per run
    - held-out conditional correctness per arm
  exclusion_rule: a run that fails audit_run.py (exit 1) is excluded and rerun with the same GPU slot.

invocations:
  - phase: guided
    started: 2026-10-15 20:41 UTC
    aka: 56feb031   # with wiki ca5d232, hyperloom 8e24562d (kf) / hyperloom_wiki_guided ccf5f599 (kf_wiki_guided), Opus 5.5
    arms: kf kf_wiki_guided
    machines:
      - {node: reserved MI300X node C, tasks: triton2triton/vllm_large/triton_awq_gemm}
      - {node: reserved MI300X node D, tasks: triton2triton/vllm_large/triton_w8a8_block_scaled_mm}
    schedule: one task per machine, its 3 repeats of both arms at once on GPUs 0-5, 3 h per run, 90% stop rule.
    stopped: 2026-10-15 22:14-22:20 UTC by the operator, after 1-3 iterations per run, to analyze the logs.
    finding: >-
      Every kf_wiki_guided run left GUIDED for FREE (GUIDED_BUDGET_SPENT) when its second round began, at 41-44%
      of the budget: the 35% guided share is counted from the loop's start, so ~25 min of baseline and initial
      analysis and ~20 min of post-KEEP processing spend it on a 3 h run, and GUIDED planned a single round. To
      fix in Hyperloom before the next guided round: count the guided share from the first planning round and
      guarantee at least two GUIDED rounds.
  - phase: main
    started: 2026-10-15 04:14 UTC
    aka: a05c6dbb   # with wiki 26ea276, hyperloom 8e24562d / hyperloom_wiki 33f0c340, Opus 5.5
    machines:
      - {node: shared MI300X dev node A, tasks: "triton2triton/ (6 tasks)"}
      - {node: shared MI300X dev node B, tasks: "torch2hip/ (3 tasks)"}
    schedule: >-
      by-task waves: one task at a time per machine, its 3 repeats of kf and kf_wiki at once on GPUs 0-5,
      12 h per run (the 90% stop rule can end a run earlier); the next task starts after all six runs end.
      The hip2hip main tasks are not part of this invocation.
  - phase: main
    started: 2026-10-15 05:31 UTC
    aka: 4b68cc68   # with wiki ca5d232, hyperloom 8e24562d / hyperloom_wiki 33f0c340, Opus 5.5
    machines:
      - {node: reserved MI300X node C, tasks: triton2triton/vllm_large/triton_awq_gemm}
      - {node: reserved MI300X node D, tasks: triton2triton/vllm_large/triton_w8a8_block_scaled_mm}
    schedule: >-
      one wave per machine: its task's 3 repeats of kf and kf_wiki at once on GPUs 0-5, 12 h per run (the 90%
      stop rule can end a run earlier). These two tasks run on wiki ca5d232, which has pages for them.
exclusions:
  - runs: pilot hip2hip/gpumode_large/SimpleMatmulModule r0-r2, kf and kf_wiki (started 2026-10-13 20:55 UTC)
    stopped: 2026-10-13 21:45 UTC, before any KEEP
    reason: >-
      The task did not forbid library delegation, and one kf analysis proposed handing the GEMM
      to hipBLASLt. The README now requires candidate-owned kernels and the harness guard refuses
      added BLAS/MIOpen/ATen operator calls; all six runs restart from scratch.
  - runs: main torch2hip/kernelbench_own/level1/l1n36_RMSNorm_ r1 kf (started 2026-10-15 15:58 UTC, GPU 2)
    stopped: 2026-10-15 16:05 UTC, before the first agent call
    reason: >-
      Forge's startup probe of claude-opus-5-5 through the gateway timed out (ClaudeUnavailableError), so
      the engine exited, the agent never ran and AKA scored the untouched candidate 0. Rerun with the same
      repeat on GPU 2 from 2026-10-15 18:34 UTC; the failed run's log and home are kept with the suffix
      .excluded-probe-timeout.
